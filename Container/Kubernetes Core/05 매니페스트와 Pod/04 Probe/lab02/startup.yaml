apiVersion: v1
kind: Pod
metadata:
  name: lab02-startup
  namespace: lab02
spec:
  terminationGracePeriodSeconds: 5
  containers:
  - name: nginx
    image: nginx:1.30
    command: ["sh", "-c", "sleep 30; exec nginx -g 'daemon off;'"]
    ports:
    - containerPort: 80
    startupProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 0
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 0
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3

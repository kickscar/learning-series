apiVersion: v1
kind: Pod
metadata:
  name: lab01-init
  namespace: lab01
spec:
  initContainers:
  - name: wait-db
    image: busybox:1.37
    command: ["sh", "-c", "until nslookup lab01-db-svc.lab01.svc.cluster.local; do echo waiting for lab01-db-svc; sleep 2; done"]
  - name: setup
    image: busybox:1.37
    command: ["sh", "-c", "echo '<h1>prepared by init container</h1>' > /work/index.html"]
    volumeMounts:
    - name: html
      mountPath: /work
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: html
    emptyDir: {}

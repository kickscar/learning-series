apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab02-web
  namespace: lab02
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab02-web
  template:
    metadata:
      labels:
        app: lab02-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        command: ["sh", "-c", "sleep 10; exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 5

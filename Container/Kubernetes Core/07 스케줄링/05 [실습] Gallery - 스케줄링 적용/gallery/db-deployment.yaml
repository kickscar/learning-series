apiVersion: apps/v1
kind: Deployment
metadata:
  name: gallery-db
  namespace: gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gallery-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gallery-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.8
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          value: "RoOt!@#$"
        - name: MARIADB_DATABASE
          value: "gallery"
        - name: MARIADB_USER
          value: "gallery"
        - name: MARIADB_PASSWORD
          value: "GaLlErY!@#$"
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab01-spread
  namespace: lab01
spec:
  replicas: 5
  selector:
    matchLabels:
      app: lab01-spread
  template:
    metadata:
      labels:
        app: lab01-spread
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: lab01-spread
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: nginx
        image: nginx:1.30

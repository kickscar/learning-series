apiVersion: v1
kind: Pod
metadata:
  name: lab02-readiness
  namespace: lab02
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    readinessProbe:
      httpGet:
        path: /ready.html
        port: 80
      initialDelaySeconds: 0
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3

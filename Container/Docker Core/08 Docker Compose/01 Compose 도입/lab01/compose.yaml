services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: 'RoOt!@#$'
      MARIADB_DATABASE: gallery
      MARIADB_USER: gallery
      MARIADB_PASSWORD: 'GaLlErY!@#$'
    volumes:
      - vol-db:/var/lib/mysql

  app:
    image: gallery:5.5
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/gallery
      SPRING_DATASOURCE_USERNAME: gallery
      SPRING_DATASOURCE_PASSWORD: 'GaLlErY!@#$'
    volumes:
      - vol-uploads:/gallery/uploads

volumes:
  vol-db:
  vol-uploads:

apiVersion: v1
kind: Pod
metadata:
  name: lab01-liveness
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 0
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3

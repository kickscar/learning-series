apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab01-nginx
  namespace: lab01
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        ports:
        - containerPort: 80

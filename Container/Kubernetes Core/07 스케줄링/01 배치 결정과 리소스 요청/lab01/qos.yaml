apiVersion: v1
kind: Pod
metadata:
  name: lab01-besteffort
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
---
apiVersion: v1
kind: Pod
metadata:
  name: lab01-burstable
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: lab01-guaranteed
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: lab01-limits-only
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab01-web
  namespace: lab01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab01-web
  template:
    metadata:
      labels:
        app: lab01-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 1

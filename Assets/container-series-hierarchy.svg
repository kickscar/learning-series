<svg width="100%" viewBox="0 0 740 510" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Container Series 레이어 계층 구조</title>
  <desc>Layer 3 Cloud Native부터 Layer 0 Container Fundamentals까지 4개 레이어로 구성된 Container 시리즈 계층도. Layer 2는 클러스터를 만드는 Kubernetes Fundamentals와 운영하는 Kubernetes Core 두 과정으로 나뉜다.</desc>
  <defs>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 구분선 -->
  <line x1="20" y1="116" x2="628" y2="116" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="274" x2="628" y2="274" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="390" x2="628" y2="390" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Layer 레이블 -->
  <text x="640" y="52"  font-size="11" fill="#888780" font-family="Arial, sans-serif">Layer 3</text>
  <text x="640" y="64"  font-size="11" fill="#888780" font-family="Arial, sans-serif">Cloud Native</text>
  <text x="640" y="192" font-size="11" fill="#888780" font-family="Arial, sans-serif">Layer 2</text>
  <text x="640" y="204" font-size="11" fill="#888780" font-family="Arial, sans-serif">Kubernetes</text>
  <text x="640" y="328" font-size="11" fill="#888780" font-family="Arial, sans-serif">Layer 1</text>
  <text x="640" y="340" font-size="11" fill="#888780" font-family="Arial, sans-serif">Docker</text>
  <text x="640" y="444" font-size="11" fill="#888780" font-family="Arial, sans-serif">Layer 0</text>
  <text x="640" y="456" font-size="11" fill="#888780" font-family="Arial, sans-serif">Fundamentals</text>

  <!-- Layer 3: Cloud Native -->
  <rect x="140" y="16" width="480" height="80" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="380" y="42" font-size="12" font-weight="bold" fill="#712B13" text-anchor="middle" font-family="Arial, sans-serif">Cloud Native</text>
  <text x="380" y="62" font-size="10" fill="#993C1D" text-anchor="middle" font-family="Arial, sans-serif">서비스 개발자 시각 · MSA 아키텍처</text>
  <text x="380" y="79" font-size="9" fill="#993C1D" text-anchor="middle" font-family="Arial, sans-serif">EKS · AKS · GKE · 릴리스 운영 · 관찰가능성</text>

  <!-- Layer 2: 클러스터 그룹 -->
  <rect x="140" y="136" width="480" height="120" rx="9" fill="none" stroke="#6D9E8B" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="152" y="156" font-size="10" fill="#0F6E56" font-family="Arial, sans-serif">클러스터</text>

  <!-- Layer 2 좌: Kubernetes Fundamentals -->
  <rect x="152" y="164" width="208" height="80" rx="7" fill="#EDF6F1" stroke="#55917A" stroke-width="0.8"/>
  <text x="256" y="190" font-size="12" font-weight="bold" fill="#2F6B58" text-anchor="middle" font-family="Arial, sans-serif">Kubernetes Fundamentals</text>
  <text x="256" y="210" font-size="10" fill="#55917A" text-anchor="middle" font-family="Arial, sans-serif">클러스터를 만든다</text>
  <text x="256" y="227" font-size="9" fill="#55917A" text-anchor="middle" font-family="Arial, sans-serif">kubeadm · Control Plane · etcd · PKI</text>

  <!-- Layer 2 우: Kubernetes Core -->
  <rect x="400" y="164" width="208" height="80" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="504" y="190" font-size="12" font-weight="bold" fill="#085041" text-anchor="middle" font-family="Arial, sans-serif">Kubernetes Core</text>
  <text x="504" y="210" font-size="10" fill="#0F6E56" text-anchor="middle" font-family="Arial, sans-serif">클러스터를 운영한다</text>
  <text x="504" y="227" font-size="9" fill="#0F6E56" text-anchor="middle" font-family="Arial, sans-serif">워크로드 · 네트워킹 · 스토리지 · 보안</text>

  <!-- Layer 1: Docker Core -->
  <rect x="140" y="292" width="480" height="80" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="380" y="318" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="middle" font-family="Arial, sans-serif">Docker Core</text>
  <text x="380" y="338" font-size="10" fill="#534AB7" text-anchor="middle" font-family="Arial, sans-serif">Docker 도구를 다룬다</text>
  <text x="380" y="355" font-size="9" fill="#534AB7" text-anchor="middle" font-family="Arial, sans-serif">이미지 · 컨테이너 · 볼륨 · 네트워크 · Compose</text>

  <!-- Layer 0: Container Fundamentals -->
  <rect x="140" y="408" width="480" height="80" rx="7" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="380" y="434" font-size="12" font-weight="bold" fill="#633806" text-anchor="middle" font-family="Arial, sans-serif">Container Fundamentals</text>
  <text x="380" y="454" font-size="10" fill="#854F0B" text-anchor="middle" font-family="Arial, sans-serif">컨테이너 기술의 본질</text>
  <text x="380" y="471" font-size="9" fill="#854F0B" text-anchor="middle" font-family="Arial, sans-serif">namespace · cgroup · OCI · Runtime</text>

  <!-- 상승 흐름: Kubernetes Core → Cloud Native -->
  <path d="M 504 164 L 504 98" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arr-dash)"/>

  <!-- 상승 흐름: Docker Core → Kubernetes Core -->
  <path d="M 504 292 L 504 246" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arr-dash)"/>

  <!-- 상호 참조: Kubernetes Fundamentals ↔ Kubernetes Core -->
  <path d="M 362 204 L 398 204" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-start="url(#arr-dash)" marker-end="url(#arr-dash)"/>

  <!-- 상호 참조: Container Fundamentals ↔ Docker Core -->
  <path d="M 200 406 L 200 374" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-start="url(#arr-dash)" marker-end="url(#arr-dash)"/>
  <text x="192" y="394" font-size="9" fill="#888780" text-anchor="end" font-family="Arial, sans-serif">본질 기반</text>

</svg>

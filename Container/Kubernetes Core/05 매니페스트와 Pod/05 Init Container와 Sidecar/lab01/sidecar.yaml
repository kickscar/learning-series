apiVersion: v1
kind: Pod
metadata:
  name: lab01-sidecar
  namespace: lab01
spec:
  initContainers:
  - name: log-tailer
    image: busybox:1.37
    restartPolicy: Always
    command: ["sh", "-c", "trap 'sleep 2; echo log-tailer stopping; exit 0' TERM; tail -F /var/log/nginx/access.log /var/log/nginx/error.log & wait"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx
  volumes:
  - name: logs
    emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab02-b
  namespace: lab02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab02-b
  template:
    metadata:
      labels:
        app: lab02-b
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.12.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab02-b-svc
  namespace: lab02
spec:
  selector:
    app: lab02-b
  ports:
  - port: 80
    targetPort: 80

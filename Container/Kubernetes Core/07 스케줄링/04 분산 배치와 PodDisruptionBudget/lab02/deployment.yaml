apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab02-web
  namespace: lab02
spec:
  replicas: 4
  selector:
    matchLabels:
      app: lab02-web
  template:
    metadata:
      labels:
        app: lab02-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3

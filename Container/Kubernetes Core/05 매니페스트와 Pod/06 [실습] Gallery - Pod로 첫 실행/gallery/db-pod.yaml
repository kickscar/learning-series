apiVersion: v1
kind: Pod
metadata:
  name: gallery-db
  namespace: gallery
  labels:
    app: gallery-db
spec:
  containers:
  - name: mariadb
    image: mariadb:11.8
    ports:
    - containerPort: 3306
    env:
    - name: MARIADB_ROOT_PASSWORD
      value: "RoOt!@#$"
    - name: MARIADB_DATABASE
      value: "gallery"
    - name: MARIADB_USER
      value: "gallery"
    - name: MARIADB_PASSWORD
      value: "GaLlErY!@#$"
    readinessProbe:
      exec:
        command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
      initialDelaySeconds: 5
      timeoutSeconds: 3
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3

apiVersion: batch/v1
kind: Job
metadata:
  name: lab01-parallel
  namespace: lab01
spec:
  completions: 3
  parallelism: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: busybox
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
        - echo "$(date +%T) start $HOSTNAME"; sleep 10; echo "$(date +%T) done $HOSTNAME"

apiVersion: v1
kind: Pod
metadata:
  name: lab01-shared
  namespace: lab01
  labels:
    app: lab01-shared
spec:
  containers:
  - name: writer
    image: busybox:1.37
    command: ["sh", "-c", "date +%T | tee -a /data-write/start.log /tmp/start.log; sleep 3600 & wait"]
    volumeMounts:
    - name: shared
      mountPath: /data-write
  - name: reader
    image: busybox:1.37
    command: ["sleep", "3600"]
    volumeMounts:
    - name: shared
      mountPath: /data-read
  volumes:
  - name: shared
    emptyDir: {}
